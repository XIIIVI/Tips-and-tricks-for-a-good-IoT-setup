version: '3.8'

services:

#################################
#                               #
#          P A R T   4          #
#                               #
#################################

  mosquitto:
    image: ${PRIVATE_REPO}/eclipse-mosquitto:2.0.22-openssl
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.mqtt == true
    ports:
      - "1883:3881"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/mosquitto/data:/mosquitto/data
      - /data/mosquitto/log:/mosquitto/log

#################################
#                               #
#          P A R T   5          #
#                               #
#################################
  telegraf-level0:
    image: ${PRIVATE_REPO}/telegraf-level0:1.34.4-alpine
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 0
    ports:
      - target: 8791    # container port
        published: 8791 # port exposed on the swarm nodes
        protocol: tcp
        mode: host      # or 'ingress' for routing mesh
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # File system
      - /proc/sys/fs:/host/proc/sys/fs:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  telegraf-level1:
    image: ${PRIVATE_REPO}/telegraf-level1:1.34.4-alpine
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 1
    ports:
      - target: 8791    # container port
        published: 8791 # port exposed on the swarm nodes
        protocol: tcp
        mode: host      # or 'ingress' for routing mesh
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  telegraf-level2:
    image: ${PRIVATE_REPO}/telegraf-level2:1.34.4-alpine
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 2
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # For temperature metrics
      - /sys/class/thermal:/sys/class/thermal:ro
      # For vcgencmd metrics
      - /tmp/telegraf_metrics:/telegraf_metrics:ro


#################################
#                               #
#          P A R T   6          #
#                               #
#################################


  vminsert:
    image: ${PRIVATE_REPO}/victoriametrics/vminsert:v1.119.0-cluster
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    command:
      - '--storageNode=vmstorage:8400'
    depends_on:
      - vmstorage
    ports:
      - "8480:8480"  # remote_write endpoint for Telegraf
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro

  vmstorage:
    image: ${PRIVATE_REPO}/victoriametrics/vmstorage:v1.119.0-cluster
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    command:
      - '--retentionPeriod=1d'
      - '--storageDataPath=/vmstorage'
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/victoriametrics:/vmstorage

  vmselect:
    image: ${PRIVATE_REPO}/victoriametrics/vmselect:v1.119.0-cluster
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    depends_on:
      - vmstorage
    ports:
      - "8481:8481"  # UI and query API
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
    command:
      - '--storageNode=vmstorage:8401'


  vmauth:
    image: ${PRIVATE_REPO}/victoriametrics/vmauth:v1.119.0
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    depends_on:
      - vmselect
    ports:
      - "8428:8428"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro


#################################
#                               #
#          P A R T   7          #
#                               #
#################################

  loki:
    image: ${PRIVATE_REPO}/grafana/loki:3.0.0
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
    ports:
      - "3100:3100"  # Loki's default HTTP port
    volumes:
      - /mnt/loki:/loki  # Bind host folder TOTO to container's /loki directory
    command: -config.file=/etc/loki/local-config.yaml

  alloy-level0:
    image: ${PRIVATE_REPO}/grafana/alloy:v1.10.2
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    ports:
      - "3131:3131"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro

  alloy-level1:
    image: ${PRIVATE_REPO}/grafana/alloy:v1.10.2
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 1
    ports:
      - "3131:3131"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro

  alloy-level2:
    image: ${PRIVATE_REPO}/grafana/alloy:v1.10.2
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 2
    ports:
      - "3131:3131"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
