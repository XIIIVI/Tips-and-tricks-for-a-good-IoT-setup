version: "3.8"

services:
  #################################
  #                               #
  #          P A R T   4          #
  #                               #
  #################################

  mosquitto:
    image: ${PRIVATE_REPO}/eclipse-mosquitto:2.0.22-openssl
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.mqtt == true
    networks:
      - public-network
    ports:
      - "1883:3881"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /data/mosquitto/data:/mosquitto/data
      - /data/mosquitto/log:/mosquitto/log

  #################################
  #                               #
  #          P A R T   5          #
  #                               #
  #################################
  telegraf-level0:
    image: ${PRIVATE_REPO}/telegraf-level0:1.34.4-alpine
    depends_on:
      - mosquitto
      - vminsert
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 0
    environment:
      - DEBUG_ON=false
      - DEBUG_QUIET=false
      - DEBUG_LOG_ROTATION_INTERVAL_IN_HOUR=0
      - DEBUG_LOG_ROTATION_MAX_SIZE_IN_MIB=10
      - DEBUG_LOG_ROTATION_MAX_ARCHIVES=5
      # To limit memory consumption for Telegraf
      # 300MB is the default value
      - GOMEMLIMIT=314572800
      - GOGC=50
      - GOMAXPROCS=4
    networks:
      - public-network
    ports:
      - target: 8791 # container port
        published: 8791 # port exposed on the swarm nodes
        protocol: tcp
        mode: host # or 'ingress' for routing mesh
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # File system
      - /proc/sys/fs:/proc/sys/fs:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  telegraf-level1:
    image: ${PRIVATE_REPO}/telegraf-level1:1.34.4-alpine
    depends_on:
      - telegraf-level0
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 1
    environment:
      - DEBUG_ON=false
      - DEBUG_QUIET=false
      - DEBUG_LOG_ROTATION_INTERVAL_IN_HOUR=0
      - DEBUG_LOG_ROTATION_MAX_SIZE_IN_MIB=10
      - DEBUG_LOG_ROTATION_MAX_ARCHIVES=5
      # To limit memory consumption for Telegraf
      # 300MB is the default value
      - GOMEMLIMIT=314572800
      - GOGC=50
      - GOMAXPROCS=4
    networks:
      - public-network
    ports:
      - target: 8791 # container port
        published: 8791 # port exposed on the swarm nodes
        protocol: tcp
        mode: host # or 'ingress' for routing mesh
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  telegraf-level2:
    image: ${PRIVATE_REPO}/telegraf-level2:1.34.4-alpine
    depends_on:
      - telegraf-level1
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 2
    environment:
      - DEBUG_ON=false
      - DEBUG_QUIET=false
      - DEBUG_LOG_ROTATION_INTERVAL_IN_HOUR=0
      - DEBUG_LOG_ROTATION_MAX_SIZE_IN_MIB=10
      - DEBUG_LOG_ROTATION_MAX_ARCHIVES=5
      # To limit memory consumption for Telegraf
      # 300MB is the default value
      - GOMEMLIMIT=314572800
      - GOGC=50
      - GOMAXPROCS=4
    networks:
      - public-network
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # For vcgencmd metrics
      - /tmp/telegraf_metrics:/telegraf_metrics:ro

  #################################
  #                               #
  #          P A R T   6          #
  #                               #
  #################################

  vminsert:
    image: ${PRIVATE_REPO}/vminsert:v1.119.0-cluster
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    command:
      - "--storageNode=iot-stack_vmstorage:8400"
    depends_on:
      - vmstorage
    networks:
      - public-network
    ports:
      - "8480:8480" # remote_write endpoint for Telegraf
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

  vmstorage:
    image: ${PRIVATE_REPO}/vmstorage:v1.119.0-cluster
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    command:
      - "--retentionPeriod=1d"
      - "--storageDataPath=/vmstorage"
    networks:
      - public-network
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - vmstorage-data:/vmstorage

  vmselect:
    image: ${PRIVATE_REPO}/vmselect:v1.119.0-cluster
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    depends_on:
      - vmstorage
    networks:
      - public-network
    ports:
      - "8481:8481" # UI and query API
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command:
      - "--storageNode=iot-stack_vmstorage:8401"

networks:
  public-network:
    driver: overlay
    internal: true # isolates backend traffic

volumes:
  vmstorage-data:
    driver: local
