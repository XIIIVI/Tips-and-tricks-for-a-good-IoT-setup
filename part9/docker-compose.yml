version: '3.8'

services:

#################################
#                               #
#          P A R T   4          #
#                               #
#################################

  mosquitto:
    image: ${PRIVATE_REPO}/eclipse-mosquitto:2.0.22-openssl
    configs:
      - source: mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
    networks:
      - secured-network
    secrets:
      - source: mosquitto.crt
        target: /etc/mosquitto/mosquitto.crt
      - source: mosquitto.key
        target: /etc/mosquitto/mosquitto.key
      - source: mosquitto.pwd
        target: /etc/mosquitto/mosquitto.pwd
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.mqtt == true
    ports:
      - "1883:3881"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/mosquitto/data:/mosquitto/data
      - /data/mosquitto/log:/mosquitto/log

#################################
#                               #
#          P A R T   5          #
#                               #
#################################
  telegraf-level0:
    image: ${PRIVATE_REPO}/telegraf:1.34.4-alpine
    configs:
      - source: telegraf-level0.conf
        target: /etc/telegraf/telegraf.conf
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 0
    networks:
      - telemetry-network
    ports:
      - target: 8791    # container port
        published: 8791 # port exposed on the swarm nodes
        protocol: tcp
        mode: host      # or 'ingress' for routing mesh
    secrets:
      - source: telegraf.crt
        target: /etc/telegraf/telegraf.crt
      - source: telegraf.key
        target: /etc/telegraf/telegraf.key
      - source: telegraf.ca
        target: /etc/telegraf/telegraf.ca
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # File system
      - /proc/sys/fs:/host/proc/sys/fs:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  telegraf-level1:
    image: ${PRIVATE_REPO}/telegraf:1.34.4-alpine
    configs:
      - source: telegraf-level1.conf
        target: /etc/telegraf/telegraf.conf
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 1
    networks:
      - telemetry-network
    ports:
      - target: 8791    # container port
        published: 8791 # port exposed on the swarm nodes
        protocol: tcp
        mode: host      # or 'ingress' for routing mesh
    secrets:
      - source: telegraf.crt
        target: /etc/telegraf/telegraf.crt
      - source: telegraf.key
        target: /etc/telegraf/telegraf.key
      - source: telegraf.ca
        target: /etc/telegraf/telegraf.ca
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro

  telegraf-level2:
    image: ${PRIVATE_REPO}/telegraf:1.34.4-alpine
    configs:
      - source: telegraf-level2.conf
        target: /etc/telegraf/telegraf.conf
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 2
    networks:
      - telemetry-network
    secrets:
      - source: telegraf.crt
        target: /etc/telegraf/telegraf.crt
      - source: telegraf.key
        target: /etc/telegraf/telegraf.key
      - source: telegraf.ca
        target: /etc/telegraf/telegraf.ca
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # For temperature metrics
      - /sys/class/thermal:/sys/class/thermal:ro
      # For vcgencmd metrics
      - /tmp/telegraf_metrics:/telegraf_metrics:ro


#################################
#                               #
#          P A R T   6          #
#                               #
#################################


  vminsert:
    image: ${PRIVATE_REPO}/vminsert:v1.119.0-cluster
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    command:
      - '--storageNode=iot-stack_vmstorage:8400'
    depends_on:
      - vmstorage
    networks:
      - telemetry-network
      - timeseries-network
    ports:
      - "8480:8480"  # remote_write endpoint for Telegraf
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro

  vmstorage:
    image: ${PRIVATE_REPO}/vmstorage:v1.119.0-cluster
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    command:
      - '--retentionPeriod=1d'
      - '--storageDataPath=/vmstorage'
    networks:
      - timeseries-network
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/database:/vmstorage

  vmselect:
    image: ${PRIVATE_REPO}/vmselect:v1.119.0-cluster
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    depends_on:
      - vmstorage
    networks:
      - secured-network
      - timeseries-network
    ports:
      - "8481:8481"  # UI and query API
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
    command:
      - '--storageNode=vmstorage:8401'


#################################
#                               #
#          P A R T   7          #
#                               #
#################################

  loki:
    image: ${PRIVATE_REPO}/loki:3.0.0
    user: "1000:1000"
    command: -config.file=/etc/loki/local-config.yaml
    configs:
      - source: loki.yaml
        target: /etc/loki/local-config.yaml
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    networks:
      - log-network
      - secured-network
    ports:
      - target: 3100    # container port
        published: 3100 # port exposed on the swarm nodes
        protocol: tcp
        mode: host      # or 'ingress' for routing mesh
    volumes:
      - /mnt/replicated-data/loki:/loki # Persistent storage for Loki

  alloy-level0:
    image: ${PRIVATE_REPO}/alloy:v1.10.2
    configs:
      - source: alloy-level0.conf
        target: /etc/alloy/config.alloy
        mode: 0444  # read-only inside container
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    networks:
      - log-network
    ports:
      - target: 3110    # container port
        published: 3110 # port exposed on the swarm nodes
        protocol: tcp
        mode: host      # or 'ingress' for routing mesh
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro

  alloy-level1:
    image: ${PRIVATE_REPO}/alloy:v1.10.2
    configs:
      - source: alloy-level1.conf
        target: /etc/alloy/config.alloy
        mode: 0444  # read-only inside container
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 1
    environment:
      - PARENT_LEVEL_NUMBER=0
    networks:
      - log-network
    ports:
      - target: 3111    # container port
        published: 3111 # port exposed on the swarm nodes
        protocol: tcp
        mode: host      # or 'ingress' for routing mesh
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro

  alloy-level2:
    image: ${PRIVATE_REPO}/alloy:v1.10.2
    configs:
      - source: alloy-level2.conf
        target: /etc/alloy/config.alloy
        mode: 0444  # read-only inside container
    deploy:
      mode: global  # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 2
    environment:
      - PARENT_LEVEL_NUMBER=1
    networks:
      - log-network
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro

#################################
#                               #
#          P A R T   8          #
#                               #
#################################

  grafana:
    image: ${PRIVATE_REPO}/grafana:12.2.0-17195718647
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana.passwd
      - GF_INSTALL_PLUGINS=volkovlabs-echarts-panel,volkovlabs-variable-panel,marcusolsson-static-datasource
    networks:
      - public-network
      - secured-network
    ports:
      - "3000:3000"
    secrets:
      - grafana.passwd
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0

networks:
  log-network:
    driver: overlay
    internal: true   # isolates backend traffic
  secured-network:
    external: true
  telemetry-network:
    external: true
  timeseries-network:
    driver: overlay
    internal: true   # isolates VictoriaMetrics cluster traffic  

configs:
  alloy-level0.alloy:
    external: true
  alloy-level1.alloy:
    external: true
  alloy-level2.alloy:
    external: true
  loki.yaml:
    external: true
  mosquitto.conf:
    external: true
  telegraf-level0.conf:
    external: true
  telegraf-level1.conf:
    external: true
  telegraf-level2.conf:
    external: true

secrets:
  grafana.passwd:
    external: true
  mosquitto.crt:
    external: true
  mosquitto.key:
    external: true
  mosquitto.passwd:
    external: true
  telegraf.crt:
    external: true
  telegraf.key:
    external: true
  telegraf.ca:
    external: true    