version: "3.8"

services:
  #################################
  #                               #
  #          P A R T   4          #
  #                               #
  #################################

  mosquitto:
    image: ${PRIVATE_REPO}/eclipse-mosquitto:2.0.22-openssl
    hostname: "{{.Node.Hostname}}"
    configs:
      - source: mosquitto.conf
        target: /mosquitto/config/mosquitto.conf
    networks:
      - telemetry-network
      - secured-network
    secrets:
      - source: mosquitto.crt
        target: /etc/mosquitto/mosquitto.crt
      - source: mosquitto.key
        target: /etc/mosquitto/mosquitto.key
      - source: mosquitto.passwd
        target: /etc/mosquitto/mosquitto.credentials
      - source: iot.ca
        target: /etc/mosquitto/ca.crt
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.mqtt == true
    ports:
      - "1883:3881"
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/mosquitto/data:/mosquitto/data
      - /data/mosquitto/log:/mosquitto/log

  #################################
  #                               #
  #          P A R T   5          #
  #                               #
  #################################
  telegraf-level0:
    image: ${PRIVATE_REPO}/telegraf:1.34.4-alpine
    hostname: "{{.Node.Hostname}}"
    configs:
      - source: telegraf-level0.conf
        target: /etc/telegraf/telegraf.conf
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 0
    environment:
      - DEBUG_ON=false
      - DEBUG_QUIET=false
      - DEBUG_LOG_ROTATION_INTERVAL_IN_HOUR=0
      - DEBUG_LOG_ROTATION_MAX_SIZE_IN_MIB=10
      - DEBUG_LOG_ROTATION_MAX_ARCHIVES=5
      # To limit memory consumption for Telegraf
      # 300MB is the default value
      - GOMEMLIMIT=314572800
      - GOGC=50
      - GOMAXPROCS=4
    networks:
      - telemetry-network
    ports:
      - target: 8791 # container port
        published: 8791 # port exposed on the swarm nodes
        protocol: tcp
        mode: host # or 'ingress' for routing mesh
    secrets:
      - source: telegraf.crt
        target: /etc/telegraf/telegraf.crt
      - source: telegraf.key
        target: /etc/telegraf/telegraf.key
      - source: iot.ca
        target: /etc/telegraf/ca.crt
      - source: mosquitto.user
        target: /etc/telegraf/mosquitto.user
      - source: mosquitto.passwd
        target: /etc/telegraf/mosquitto.passwd
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # File system
      - /proc/sys/fs:/host/proc/sys/fs:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    user: "telegraf:985"

  telegraf-level1:
    image: ${PRIVATE_REPO}/telegraf:1.34.4-alpine
    hostname: "{{.Node.Hostname}}"
    configs:
      - source: telegraf-level1.conf
        target: /etc/telegraf/telegraf.conf
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 1
    environment:
      - DEBUG_ON=false
      - DEBUG_QUIET=false
      - DEBUG_LOG_ROTATION_INTERVAL_IN_HOUR=0
      - DEBUG_LOG_ROTATION_MAX_SIZE_IN_MIB=10
      - DEBUG_LOG_ROTATION_MAX_ARCHIVES=5
      # To limit memory consumption for Telegraf
      # 300MB is the default value
      - GOMEMLIMIT=314572800
      - GOGC=50
      - GOMAXPROCS=4
    networks:
      - telemetry-network
    ports:
      - target: 8791 # container port
        published: 8791 # port exposed on the swarm nodes
        protocol: tcp
        mode: host # or 'ingress' for routing mesh
    secrets:
      - source: telegraf.crt
        target: /etc/telegraf/telegraf.crt
      - source: telegraf.key
        target: /etc/telegraf/telegraf.key
      - source: iot.ca
        target: /etc/telegraf/ca.crt
      - source: mosquitto.user
        target: /etc/telegraf/mosquitto.user
      - source: mosquitto.passwd
        target: /etc/telegraf/mosquitto.passwd
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    user: "telegraf:985"

  telegraf-level2:
    image: ${PRIVATE_REPO}/telegraf:1.34.4-alpine
    hostname: "{{.Node.Hostname}}"
    configs:
      - source: telegraf-level2.conf
        target: /etc/telegraf/telegraf.conf
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      resources:
        limits:
          memory: 100M
          cpus: "1"
      placement:
        constraints:
          - node.labels.level == 2
    environment:
      - DEBUG_ON=false
      - DEBUG_QUIET=false
      - DEBUG_LOG_ROTATION_INTERVAL_IN_HOUR=0
      - DEBUG_LOG_ROTATION_MAX_SIZE_IN_MIB=10
      - DEBUG_LOG_ROTATION_MAX_ARCHIVES=5
      # To limit memory consumption for Telegraf
      # 300MB is the default value
      - GOMEMLIMIT=314572800
      - GOGC=50
      - GOMAXPROCS=4
    networks:
      - telemetry-network
    secrets:
      - source: telegraf.crt
        target: /etc/telegraf/telegraf.crt
      - source: telegraf.key
        target: /etc/telegraf/telegraf.key
      - source: iot.ca
        target: /etc/telegraf/ca.crt
      - source: mosquitto.user
        target: /etc/telegraf/mosquitto.user
      - source: mosquitto.passwd
        target: /etc/telegraf/mosquitto.passwd
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/telegraf:/telegraf
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # For CPU metrics
      - /proc/stat:/proc/stat:ro
      - /proc/cpuinfo:/proc/cpuinfo:ro
      # For memory metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # For temperature metrics
      - /sys/class/thermal:/sys/class/thermal:ro
      # For vcgencmd metrics
      - /tmp/telegraf_metrics:/telegraf_metrics:ro
    user: "telegraf:985"

  #################################
  #                               #
  #          P A R T   6          #
  #                               #
  #################################

  vminsert:
    image: ${PRIVATE_REPO}/vminsert:v1.119.0-cluster
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    command:
      - "--storageNode=vmstorage:8400"
    depends_on:
      - vmstorage
    networks:
      - telemetry-network
      - timeseries-network
    ports:
      - "8480:8480" # remote_write endpoint for Telegraf
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro

  vmstorage:
    image: ${PRIVATE_REPO}/vmstorage:v1.119.0-cluster
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    command:
      - "--retentionPeriod=1d"
      - "--storageDataPath=/vmstorage"
    networks:
      - timeseries-network
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - vmstorage-data:/vmstorage

  vmselect:
    image: ${PRIVATE_REPO}/vmselect:v1.119.0-cluster
    hostname: "{{.Node.Hostname}}"
    deploy:
      mode: global
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    depends_on:
      - vmstorage
    networks:
      - secured-network
      - timeseries-network
    ports:
      - "8481:8481" # UI and query API
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
    command:
      - "--storageNode=vmstorage:8401"

  #################################
  #                               #
  #          P A R T   7          #
  #                               #
  #################################

  loki:
    image: ${PRIVATE_REPO}/loki:3.0.0
    hostname: "{{.Node.Hostname}}"
    user: "10001:10001"
    command: -config.file=/etc/loki/local-config.yaml
    configs:
      - source: loki-config.yaml
        target: /etc/loki/local-config.yaml
    deploy:
      mode: replicated
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    networks:
      - secured-network
      - log-network
    ports:
      - "3100:3100" # or 'ingress' for routing mesh
    secrets:
      - source: loki.crt
        target: /etc/loki/loki.crt
      - source: loki.key
        target: /etc/loki/loki.key
      - source: iot.ca
        target: /etc/loki/ca.crt
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /mnt/replicated-data/loki:/loki-chunks # Persistent storage for Loki
      - loki_data:/loki/ # local disk

  alloy-level0:
    image: ${PRIVATE_REPO}/alloy:v1.10.2
    hostname: "{{.Node.Hostname}}"
    configs:
      - source: alloy-level0.alloy
        target: /etc/alloy/config.alloy
        mode: 0444 # read-only inside container
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    networks:
      - log-network
    ports:
      - target: 3110 # container port
        published: 3110 # port exposed on the swarm nodes
        protocol: tcp
        mode: host # or 'ingress' for routing mesh
    secrets:
      - source: alloy.crt
        target: /etc/alloy/alloy.crt
      - source: alloy.key
        target: /etc/alloy/alloy.key
      - source: iot.ca
        target: /etc/alloy/ca.crt
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
    user: "telegraf:985"

  alloy-level1:
    image: ${PRIVATE_REPO}/alloy:v1.10.2
    hostname: "{{.Node.Hostname}}"
    configs:
      - source: alloy-level1.alloy
        target: /etc/alloy/config.alloy
        mode: 0444 # read-only inside container
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 1
    environment:
      - PARENT_LEVEL_NUMBER=0
    networks:
      - log-network
    ports:
      - target: 3111 # container port
        published: 3111 # port exposed on the swarm nodes
        protocol: tcp
        mode: host # or 'ingress' for routing mesh
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
    user: "telegraf:985"

  alloy-level2:
    image: ${PRIVATE_REPO}/alloy:v1.10.2
    hostname: "{{.Node.Hostname}}"
    configs:
      - source: alloy-level2.alloy
        target: /etc/alloy/config.alloy
        mode: 0444 # read-only inside container
    deploy:
      mode: global # Ensures one instance per eligible node
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 2
    environment:
      - PARENT_LEVEL_NUMBER=1
    networks:
      - log-network
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro
      - /data/alloy:/alloy
      # For Docker
      - /var/run/docker.sock:/var/run/docker.sock:ro
    user: "telegraf:985"

  #################################
  #                               #
  #          P A R T   8          #
  #                               #
  #################################

  grafana:
    image: ${PRIVATE_REPO}/grafana:12.2.0
    hostname: "{{.Node.Hostname}}"
    environment:
      - GF_PLUGINS_PREINSTALL_SYNC=volkovlabs-echarts-panel,volkovlabs-variable-panel,marcusolsson-static-datasource
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_UID=dash_raspberry_s_metrics
    networks:
      - public-network
      - secured-network
    ports:
      - "8080:3000"
    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.labels.level == 0
    # Ensure the container runs your shell script as PID 1 instead of the image's /run.sh 
    entrypoint:
      - /bin/sh
      - -c
    command:
    - |
      set -euo pipefail

      echo "=== grafana init start ==="

      PROV_DIR="/etc/grafana/provisioning/datasources"
      mkdir -p "$$PROV_DIR"

      # read secrets if they exist
      CA="$$(cat /etc/loki/ca.crt 2>/dev/null || true)"
      CLIENT_CERT="$$(cat /etc/loki/loki.crt 2>/dev/null || true)"
      CLIENT_KEY="$$(cat /etc/loki/loki.key 2>/dev/null || true)"

      # use Compose-safe default expansion for LOKI_HOST
      LOKI_HOST="$${LOKI_HOST:-loki}"

      # write provisioning header using printf
      printf '%s\n' \
        "apiVersion: 1" \
        "datasources:" \
        "  - name: Loki with TLS" \
        "    uid: ds_loki_tls" \
        "    type: loki" \
        "    access: proxy" \
        "    typeLogoUrl: public/plugins/loki/img/loki_icon.svg" \
        "    url: https://$$LOKI_HOST:3100/" \
        "    basicAuth: false" \
        "    basicAuthUser: ''" \
        "    withCredentials: false" \
        "    isDefault: false" \
        "    jsonData:" \
        "      tlsAuth: true" \
        "      tlsAuthWithCACert: true" \
        "      tlsSkipVerify: false" \
        "      serverName: $$LOKI_HOST" \
        "      pdcInjected: false" \
        "    secureJsonData:" \
        "      tlsCACert: |" > "$$PROV_DIR/loki.yaml"

      # append CA block (8-space indentation) or blank line
      if [ -n "$$CA" ]; then
        printf '%s\n' "$$CA" | sed 's/^/        /' >> "$$PROV_DIR/loki.yaml"
      else
        printf '        \n' >> "$$PROV_DIR/loki.yaml"
      fi

      # tlsClientCert block
      printf '%s\n' "      tlsClientCert: |" >> "$$PROV_DIR/loki.yaml"
      if [ -n "$$CLIENT_CERT" ]; then
        printf '%s\n' "$$CLIENT_CERT" | sed 's/^/        /' >> "$$PROV_DIR/loki.yaml"
      else
        printf '        \n' >> "$$PROV_DIR/loki.yaml"
      fi

      # tlsClientKey block
      printf '%s\n' "      tlsClientKey: |" >> "$$PROV_DIR/loki.yaml"
      if [ -n "$$CLIENT_KEY" ]; then
        printf '%s\n' "$$CLIENT_KEY" | sed 's/^/        /' >> "$$PROV_DIR/loki.yaml"
      else
        printf '        \n' >> "$$PROV_DIR/loki.yaml"
      fi

      printf '\n' >> "$$PROV_DIR/loki.yaml"

      # permissions for Grafana UID (472)
      chown -R 472:472 /etc/grafana/provisioning || true
      chmod -R 0700 /etc/grafana/provisioning || true

      echo "=== grafana init handoff ==="

      if [ -x /run.sh ]; then
        exec /run.sh
      else
        exec grafana-server --homepath=/usr/share/grafana --config=/etc/grafana/grafana.ini
      fi
    secrets:
      - source: loki.crt
        target: /etc/loki/loki.crt
      - source: loki.key
        target: /etc/loki/loki.key
      - source: iot.ca
        target: /etc/loki/ca.crt
    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - /etc/hostname:/etc/hostname:ro


networks:
  log-network:
    driver: overlay
    internal: true # isolates backend traffic
  public-network:
    driver: overlay
    internal: true # isolates backend traffic
  secured-network:
    external: true
  telemetry-network:
    external: true
  timeseries-network:
    driver: overlay
    internal: true # isolates VictoriaMetrics cluster traffic

configs:
  alloy-level0.alloy:
    external: true
  alloy-level1.alloy:
    external: true
  alloy-level2.alloy:
    external: true
  loki-config.yaml:
    external: true
  mosquitto.conf:
    external: true
  telegraf-level0.conf:
    external: true
  telegraf-level1.conf:
    external: true
  telegraf-level2.conf:
    external: true

secrets:
  alloy.crt:
    external: true
  alloy.key:
    external: true
  grafana.crt:
    external: true
  grafana.key:
    external: true
  iot.ca:
    external: true
  loki.crt:
    external: true
  loki.key:
    external: true
  mosquitto.crt:
    external: true
  mosquitto.key:
    external: true
  mosquitto.passwd:
    external: true
  mosquitto.user:
    external: true
  telegraf.crt:
    external: true
  telegraf.key:
    external: true

volumes:
  loki_data:
  vmstorage-data:
    driver: local
