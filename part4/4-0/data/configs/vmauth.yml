users:
  # User for read operations (queries)
  - username: "file:///run/secrets/vmauth_reader.user"
    password: "file:///run/secrets/vmauth_reader.passwd"
    url_prefix: "http://iot-stack_vmselect:8481/select/0/prometheus"
    
  # User for write operations (metrics ingestion)
  - username: "file:///run/secrets/vmauth_writer.user"
    password: "file:///run/secrets/vmauth_writer.passwd"
    url_prefix: "http://iot-stack_vminsert:8480/insert/0/prometheus"
